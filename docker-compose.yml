services:
  app_bank:
    build:
      context: .
      dockerfile: Dockerfile.bank
    ports:
      - "11056:11056"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://${DB_HOST:-localhost}:1433;databaseName=BankDB;encrypt=true;trustServerCertificate=true
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-sa}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASS:-tvojaLokalnaSifra}
      - SPRING_KAFKA_PRODUCER_BOOTSTRAP_SERVERS=${KAFKA_HOST:-localhost}:9092
    networks:
      - bank-network
    volumes:
      - ./logs:/app/logs

  notification:
    build:
      context: .
      dockerfile: Dockerfile.notification
    ports:
      - "11057:11057"
    environment:
      - SPRING_KAFKA_CONSUMER_BOOTSTRAP_SERVERS=${KAFKA_HOST:-localhost}:9092
    depends_on:
      kafka:
        condition: service_started
    networks:
      - bank-network
    volumes:
      - ./logs:/app/logs

  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_HOST:-localhost}:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - bank-network

networks:
  bank-network:
    driver: bridge
